spring:
  application:
    name: channelpulse
  config:
    import: optional:file:./application-local.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/channelpulse
    username: channelpulse
    password: channelpulse
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

telegram:
  bot:
    token: ""
    username: ChannelPulseBot
    enabled: false
    connect-timeout-ms: 120000
    socket-timeout-ms: 130000
    connection-request-timeout-ms: 30000
    proxy:
      enabled: false
      host: 127.0.0.1
      port: 7890
      type: SOCKS5

pulse:
  billing:
    enabled: false
  analysis:
    period-days: 90
    min-posts-full: 10
    fast-mode: true
    sync-max-posts: 100
    sync-max-pages: 6
    sync-timeout-ms: 20000
    min-posts-for-analysis: 3
    skip-bot-api-during-sync: true
    llm-timeout-seconds: 60
    stale-request-timeout-minutes: 4
    llm-sample-posts: 14
  external:
    tgstat-token: ${TGSTAT_TOKEN:}
    tgstat-timeout-ms: 8000
  ai:
    provider: proxyapi-openai
    model: gpt-4o
    api-key: ${PROXYAPI_API_KEY:}
    base-url: https://api.proxyapi.ru/openai/v1
    max-retries: 2
    timeout-seconds: 60
    temperature-ideas: 0.85
    temperature-posts: 0.8

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.example.pulse_ai: INFO
