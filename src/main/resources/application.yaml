spring:
  application:
    name: channelpulse
  config:
    import: optional:file:./application-local.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/channelpulse
    username: channelpulse
    password: channelpulse
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

telegram:
  bot:

    token: ""
    username: ChannelPulseBot
    enabled: false
    connect-timeout-ms: 120000
    socket-timeout-ms: 130000
    connection-request-timeout-ms: 30000

  proxy:
        enabled: true
        host: 127.0.0.1
        port: 10808
        type: SOCKS5
pulse:
  billing:
    enabled: false
    free-ideas-count: 3
    paid-ideas-count: 12
    free-draft-limit: 3
    paid-draft-limit: 7
  analysis:
    period-days: 90
    min-posts-full: 10
    fast-mode: true
    sync-max-posts: 100
    sync-max-pages: 6
    sync-timeout-ms: 20000
    min-posts-for-analysis: 3
    skip-bot-api-during-sync: true
    llm-timeout-seconds: 60
    stale-request-timeout-minutes: 4
    llm-sample-posts: 14
  external:
    tgstat-token: ${TGSTAT_TOKEN:}
    tgstat-timeout-ms: 8000
    tgstat-paid-only: true
  ai:
    provider: proxyapi-openai
    model: gpt-4o
    api-key: ${PROXYAPI_API_KEY:}
    base-url: https://api.proxyapi.ru/openai/v1
    max-retries: 2
    timeout-seconds: 60
    temperature-ideas: 0.85
    temperature-posts: 0.8
  images:
    enabled: true
    pexels-api-key: ${PEXELS_API_KEY:}
    http-timeout-ms: 8000
    candidates-per-query: 12
  product:
    enabled: false
    channel-username: ""
    channel-chat-id:
    owner-telegram-ids: []
    reference-channels: []
    morning-brief-enabled: true
    morning-brief-hour: 9
    bot-link: "https://t.me/Pulsse_AI_bot"
  outreach:
    dispatch-enabled: false
    monthly-send-limit: 100
    default-daily-limit: 15
    min-delay-seconds: 45
    max-delay-seconds: 120
    max-campaigns-per-user: 10
  scout:
    enabled: false
    sidecar-url: ${SCOUT_SIDECAR_URL:}
    sidecar-timeout-ms: 30000
    admin-telegram-ids: []
    radar-keywords:
      - реклам
      - прайс
      - размещени
      - price
  admin:
    web-enabled: true
    web-token: ${PULSE_ADMIN_TOKEN:pulse-local-admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.example.pulse_ai: INFO
